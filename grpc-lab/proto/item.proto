syntax = "proto3";

service ItemService {
  rpc CheckItemAvailability (ItemRequest) returns (ItemResponse) {}
  rpc SubmitClaim (ClaimRequest) returns (ClaimResponse) {}
}

message ItemRequest {
  string item_id = 1;
  int32 lamport_clock = 2; 
}

message ItemResponse {
  bool available = 1;
  string message = 2;
  int32 lamport_clock = 3; 
}

message ClaimRequest {
  string item_id = 1;
  string user_email = 2;
  int32 lamport_clock = 3; 
}

message ClaimResponse {
  bool success = 1;
  string message = 2;
  int32 lamport_clock = 3; 
}


service ClaimLockService {
  rpc RequestAccess (AccessRequest) returns (AccessReply);
}
 
message AccessRequest {
  int32 node_id = 1;
  int32 timestamp = 2;
}
 
message AccessReply {
  int32 node_id = 1;
  int32 timestamp = 2;
}
 
service LockService {
  rpc AcquireLock (LockRequest) returns (LockReply);
  rpc ReleaseLock (LockRequest) returns (LockReply);
}
 
message LockRequest {
  string resource_id = 1;
  int32 holder_id = 2;
  int32 timestamp = 3;
}
 
message LockReply {
  bool granted = 1;
  string message = 2;
}
 service WorkerService {
  rpc HandleRequest (WorkRequest) returns (WorkReply);
}
 
message WorkRequest {
  int32 request_id = 1;
}
 
message WorkReply {
  int32 request_id = 1;
  string handled_by = 2;
  string status = 3;
}
service ReplicaService {
  rpc SaveValue (ValueUpdate) returns (SaveAck);   // client -> replica (local write)
  rpc SyncUpdate (ValueUpdate) returns (SaveAck);  // replica -> replica (gossip)
  rpc GetValue (ValueQuery) returns (ValueState);  // read current state
}
 
message ValueUpdate {
  string key = 1;
  string content = 2;
  int32 lamport_timestamp = 3;
  string origin_replica = 4;
}
 
message SaveAck {
  bool accepted = 1;
  string replica = 2;
  int32 lamport_timestamp = 3;
}
 
message ValueQuery {
  string key = 1;
}
 
message ValueState {
  string key = 1;
  string content = 2;
  int32 lamport_timestamp = 3;
  string origin_replica = 4;
}

